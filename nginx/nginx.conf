events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 55M;

    gzip on;
    gzip_types text/html application/json application/geo+json text/css application/javascript image/svg+xml;
    gzip_min_length 1000;

    upstream frontend_server {
        server frontend:3000;
    }

    upstream backend_server {
        server backend:8000;
    }

    upstream geoserver_server {
        server geoserver:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Media files — served directly from volume with long cache ──────
        # Images are content-addressed (upload renames them); safe to cache 30d.
        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
            gzip_static on;
        }

        # ── Next.js static assets — permanently immutable ──────────────────
        # Next.js hashes every chunk filename; safe to cache forever.
        location /_next/static/ {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Next.js image optimisation endpoint ────────────────────────────
        # Serves resized/WebP-converted images; cache 7 days.
        location /_next/image {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # ── Shapefile import route (extended timeout) ──────────────────────
        location /api/admin/import/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        # ── Admin API — never cache (must be fresh) ────────────────────────
        location /api/admin/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-store";
        }

        # ── Public API — short cache (5 minutes) ──────────────────────────
        # Potensi data changes infrequently; safe to cache briefly.
        location /api/public/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 5m;
            add_header Cache-Control "public, max-age=300";
        }

        # ── All remaining Django API endpoints ─────────────────────────────
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Django Admin UI ────────────────────────────────────────────────
        location /django-admin/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── GeoServer WMS/WFS endpoints ────────────────────────────────────
        location /geoserver/ {
            proxy_pass http://geoserver_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Next.js Frontend (Catch-all) ───────────────────────────────────
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
